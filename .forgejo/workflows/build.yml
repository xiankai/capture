name: build
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    paths-ignore: ['**.md']

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: vars.ANDROID_CI_LOCAL == '1'
    runs-on: ubuntu-latest
    container:
      image: android-ci:latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        run: |
          set -euo pipefail
          test -n "${RUN_TOKEN}" || { echo "::error::no ephemeral run token available to clone a private repo"; exit 1; }
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader GIT_CONFIG_VALUE_0="Authorization: token ${RUN_TOKEN}"
          git clone --quiet --no-tags --filter=blob:none \
            "https://forgejo.example.invalid/${GITHUB_REPOSITORY}.git" /tmp/repo
          if [ -n "${PR_NUMBER}" ]; then
            git -C /tmp/repo fetch --quiet origin "refs/pull/${PR_NUMBER}/head:refs/heads/pr-head"
            git -C /tmp/repo -c advice.detachedHead=false checkout --quiet pr-head
          else
            git -C /tmp/repo -c advice.detachedHead=false checkout --quiet "${GITHUB_SHA}"
          fi
        env:
          RUN_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Gradle cache key
        id: key
        run: |
          set -euo pipefail
          cd /tmp/repo
          files=$(git ls-files 'gradle/libs.versions.toml' 'gradle/wrapper/gradle-wrapper.properties' '*.gradle.kts')
          [ -n "$files" ] || { echo "::error::no Gradle files matched for the cache key"; exit 1; }
          h=$(printf '%s\n' "$files" | xargs -d '\n' sha256sum | sha256sum | cut -c1-16)
          echo "key=gradle-build-${h}" >> "$GITHUB_OUTPUT"

      - name: Restore the Gradle cache
        uses: https://data.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.key.outputs.key }}
          restore-keys: |
            gradle-build-

      - name: Unit tests and lint
        run: |
          set -euo pipefail
          cd /tmp/repo
          ./gradlew --no-daemon --continue testDebugUnitTest lintDebug
        env:
          ANDROID_HOME: /opt/android-sdk
          GRADLE_OPTS: -Dorg.gradle.configuration-cache=false

      - name: Tidy the Gradle cache before it is saved
        if: success()
        run: |
          rm -f ~/.gradle/caches/modules-2/modules-2.lock ~/.gradle/caches/modules-2/gc.properties
          find ~/.gradle/caches -name '*.lock' -type f -delete 2>/dev/null || true

      - name: Lint report on failure
        if: failure()
        run: |
          report=/tmp/repo/app/build/reports/lint-results-debug.txt
          [ -f "$report" ] && tail -100 "$report" || echo "no lint report produced"

  github-ci:
    if: vars.ANDROID_CI_LOCAL != '1'
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm
    timeout-minutes: 60
    steps:
      - name: Wait for the GitHub ci run on this commit
        env:
          GITHUB_REPO: clockwork-princess/capture
          TOKEN: ${{ secrets.GITHUB_ACTIONS_READ_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --input-type=module <<'EOF'
          const { GITHUB_REPO, TOKEN, SHA } = process.env;
          if (!TOKEN) {
            console.log("::error::the GITHUB_ACTIONS_READ_TOKEN secret is not set");
            process.exit(1);
          }
          const runsUrl = `https://api.github.com/repos/${GITHUB_REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=5`;
          const headers = { Authorization: `Bearer ${TOKEN}`, Accept: "application/vnd.github+json", "User-Agent": "capture-github-ci-relay" };
          const pollMs = 20_000;
          const appearWithinMs = 10 * 60_000;
          const started = Date.now();
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function newestRun() {
            const response = await fetch(runsUrl, { headers });
            if (!response.ok) {
              console.log(`::error::GitHub answered HTTP ${response.status} for ${GITHUB_REPO}'s runs: ${(await response.text()).slice(0, 200)}`);
              process.exit(1);
            }
            const { workflow_runs: runs } = await response.json();
            return runs.sort((a, b) => b.id - a.id)[0];
          }

          let announced = false;
          for (;;) {
            const run = await newestRun();
            if (!run && Date.now() - started > appearWithinMs) { // stack-reviewer-ignore: runs every iteration; an empty list makes run undefined, so the 10-minute limit applies to it
              console.log(`::error::no GitHub ci run for ${SHA} after 10 minutes. Is the push mirror carrying this branch?`);
              process.exit(1);
            }
            if (run && !announced) {
              console.log(`GitHub run: ${run.html_url}`);
              announced = true;
            }
            if (run?.status === "completed") {
              if (run.conclusion === "success") {
                console.log(`passed on GitHub: ${run.html_url}`);
                process.exit(0);
              }
              console.log(`::error::GitHub ci ${run.conclusion}: ${run.html_url}`);
              process.exit(1);
            }
            await sleep(pollMs);
          }
          EOF
