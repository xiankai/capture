name: publish
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  tag:
    if: vars.ANDROID_CI_LOCAL != '1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm
    timeout-minutes: 5
    steps:
      - name: Tag the commit with its versionCode, for GitHub's release workflow
        env:
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          RUN_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'EOF'
          const { API, RUN_TOKEN, SHA } = process.env;
          const headers = { Authorization: `token ${RUN_TOKEN}`, "Content-Type": "application/json" };
          const fail = (message) => { console.log(`::error::${message}`); process.exit(1); };

          const commit = await fetch(`${API}/git/commits/${SHA}`, { headers });
          if (!commit.ok) fail(`reading commit ${SHA} returned HTTP ${commit.status}`);
          const committed = (await commit.json()).commit.committer.date;
          const tag = `v${Math.floor(Date.parse(committed) / 1000)}`; // stack-reviewer-ignore: app/build.gradle.kts sets versionCode from git log -1 --format=%ct, the same committer timestamp, and release.yml fails the release if they ever differ

          const existing = await fetch(`${API}/tags/${tag}`, { headers });
          if (existing.ok) {
            const taggedSha = (await existing.json()).commit.sha;
            if (taggedSha !== SHA) fail(`${tag} already tags ${taggedSha}, not ${SHA}: two commits share a committer second, so this one gets no release`);
            console.log(`${tag} already tags ${SHA}`);
            process.exit(0);
          }
          if (existing.status !== 404) fail(`looking up ${tag} returned HTTP ${existing.status}`);

          const created = await fetch(`${API}/tags`, { method: "POST", headers, body: JSON.stringify({ tag_name: tag, target: SHA }) });
          if (!created.ok) fail(`creating ${tag} returned HTTP ${created.status}: ${(await created.text()).slice(0, 200)}`);
          console.log(`tagged ${SHA} as ${tag}; the push mirror carries it to GitHub, which builds the release`); // stack-reviewer-ignore: by design (issue #19): the mirror prunes GitHub-only refs, so tags must start here; sync_on_commit pushes the tag within seconds, and a failed mirror push is repaired by the homelab reconcile
          EOF

  publish:
    if: vars.ANDROID_CI_LOCAL == '1'
    runs-on: android
    container:
      image: }
    timeout-minutes: 30
    env:
      API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
      APK: /tmp/repo/app/build/outputs/apk/release/app-release.apk
      ANDROID_HOME: /opt/android-sdk
    steps:
      - name: Checkout the commit, if it is on main
        run: |
          set -euo pipefail
          test -n "${RUN_TOKEN}" || { echo "::error::no ephemeral run token available to clone a private repo"; exit 1; }
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.extraHeader GIT_CONFIG_VALUE_0="Authorization: token ${RUN_TOKEN}"
          git clone --quiet --no-tags --filter=blob:none --branch main \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" /tmp/repo
          cd /tmp/repo
          git -c advice.detachedHead=false checkout --quiet "${GITHUB_SHA}"
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::${GITHUB_SHA} is not on main. Merge it first."
            exit 1
          }
          echo "publishing ${GITHUB_SHA} ($(git log -1 --format=%s))"
        env:
          RUN_TOKEN: ${{ github.token }}

      - name: Gradle cache key
        id: key
        run: |
          set -euo pipefail
          cd /tmp/repo
          files=$(git ls-files 'gradle/libs.versions.toml' 'gradle/wrapper/gradle-wrapper.properties' '*.gradle.kts')
          [ -n "$files" ] || { echo "::error::no Gradle files matched for the cache key"; exit 1; }
          h=$(printf '%s\n' "$files" | xargs -d '\n' sha256sum | sha256sum | cut -c1-16)
          echo "key=gradle-build-${h}" >> "$GITHUB_OUTPUT"

      - name: Restore the Gradle cache
        uses: https://data.forgejo.org/actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ steps.key.outputs.key }}
          restore-keys: |
            gradle-build-

      - name: Build the signed release APK
        run: |
          set -euo pipefail
          test -n "${CAPTURE_ORCHESTRATOR}" || { echo "::error::the CAPTURE_ORCHESTRATOR variable is not set, so the build would ship with no orchestrator"; exit 1; }
          test -n "${KEYSTORE_B64}" || { echo "::error::the SIDELOAD_KEYSTORE_BASE64 secret is not set"; exit 1; }
          test -n "${KEYSTORE_PROPS}" || { echo "::error::the SIDELOAD_KEYSTORE_PROPERTIES secret is not set"; exit 1; }
          property() { awk -F= -v k="$1" '$1 == k { sub(/^[^=]*=/, ""); print; exit }' <<<"$KEYSTORE_PROPS"; }
          export RELEASE_KEYSTORE_PATH=/tmp/capture-release.jks
          RELEASE_KEYSTORE_PASSWORD=$(property storePassword)
          RELEASE_KEY_ALIAS=$(property keyAlias)
          RELEASE_KEY_PASSWORD=$(property keyPassword)
          export RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RELEASE_KEYSTORE_PATH"
          cd /tmp/repo
          ./gradlew --no-daemon assembleRelease
        env:
          KEYSTORE_B64: ${{ secrets.SIDELOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PROPS: ${{ secrets.SIDELOAD_KEYSTORE_PROPERTIES }}
          CAPTURE_ORCHESTRATOR: ${{ vars.CAPTURE_ORCHESTRATOR }}
          GRADLE_OPTS: -Dorg.gradle.configuration-cache=false

      - name: Verify the signature and read the version
        run: |
          set -euo pipefail
          rm -f /tmp/capture-release.jks
          [ -f "$APK" ] || { echo "::error::no signed APK; outputs were: $(ls "$(dirname "$APK")")"; exit 1; }
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$tools/apksigner" verify "$APK" || { echo "::error::apksigner did not verify the APK"; exit 1; }
          badging=$("$tools/aapt2" dump badging "$APK")
          code=$(awk -F"'" '/^package:/ { for (i = 1; i < NF; i++) if ($i ~ /versionCode=$/) { print $(i + 1); exit } }' <<<"$badging")
          name=$(awk -F"'" '/^package:/ { for (i = 1; i < NF; i++) if ($i ~ /versionName=$/) { print $(i + 1); exit } }' <<<"$badging")
          [ -n "$code" ] && [ -n "$name" ] || { echo "::error::could not read versionCode/versionName"; exit 1; }
          newest=$(curl -fsS -H "Authorization: token ${RUN_TOKEN}" "$API/releases?limit=50" \
            | jq -r '[.[].tag_name | select(test("^v[0-9]+$")) | ltrimstr("v") | tonumber] | max // 0')
          if [ "$code" -lt "$newest" ]; then  # stack-reviewer-ignore: versionCode is the HEAD commit's timestamp, so an equal one is a re-run of the same commit and republishing it is intended
            echo "::error::versionCode $code is older than the newest release v$newest and would not install over it"
            exit 1
          fi
          { echo "VERSION_CODE=${code}"; echo "VERSION_NAME=${name}"; } >> "$GITHUB_ENV"
          echo "versionCode $code ($name), newest release v$newest"
        env:
          RUN_TOKEN: ${{ github.token }}

      - name: Upload to dufs, replacing the previous copy
        run: |
          set -euo pipefail
          test -n "${DUFS_URL}" || { echo "::error::the CAPTURE_DUFS_URL variable is not set"; exit 1; }
          staging="${DUFS_URL}.upload"
          want=$(stat -c %s "$APK")
          code=$(curl -sS -o /dev/null -w '%{http_code}' -T "$APK" "$staging")
          case "$code" in 2*) ;; *) echo "::error::dufs upload failed with HTTP $code"; exit 1 ;; esac
          got=$(curl -sSI "$staging" | awk -F': ' 'tolower($1) == "content-length" { print $2 + 0 }')
          [ "$got" = "$want" ] || { echo "::error::dufs holds $got bytes of a $want-byte APK; the live copy was left alone"; exit 1; }
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X MOVE -H "Destination: ${DUFS_URL}" -H 'Overwrite: T' "$staging")
          case "$code" in 2*) echo "uploaded to $DUFS_URL ($want bytes)" ;; *) echo "::error::moving the upload into place failed with HTTP $code"; exit 1 ;; esac
        env:
          DUFS_URL: ${{ vars.CAPTURE_DUFS_URL }}

      - name: Publish a release, keeping the latest three
        run: |
          set -euo pipefail
          cd /tmp/repo
          auth="Authorization: token ${RUN_TOKEN}"
          tag="v${VERSION_CODE}"
          existing=$(curl -sS -o /dev/null -w '%{http_code}' -H "$auth" "$API/releases/tags/${tag}")
          case "$existing" in
            200)
              curl -fsS -X DELETE -H "$auth" "$API/releases/tags/${tag}"
              curl -sS -o /dev/null -X DELETE -H "$auth" "$API/tags/${tag}"
              ;;
            404) ;;
            *) echo "::error::looking up release $tag returned HTTP $existing"; exit 1 ;;
          esac
          payload=$(jq -n --arg tag "$tag" --arg target "$GITHUB_SHA" --arg name "$VERSION_NAME" \
                       --arg body "$(git log -1 --pretty='%s%n%n%H')" \
                       '{tag_name: $tag, target_commitish: $target, name: $name, body: $body, draft: false, prerelease: false}')
          id=$(curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' --data "$payload" "$API/releases" | jq -r '.id')
          [ -n "$id" ] && [ "$id" != "null" ] || { echo "::error::release creation returned no id"; exit 1; }
          curl -fsS -X POST -H "$auth" \
            -F "attachment=@${APK};type=application/vnd.android.package-archive" \
            "$API/releases/${id}/assets?name=capture.apk" >/dev/null
          echo "released $tag ($VERSION_NAME)"
          releases=$(curl -fsS -H "$auth" "$API/releases?limit=50")
          stale=$(jq -r 'map(select(.tag_name | test("^v[0-9]+$"))) | sort_by(.tag_name | ltrimstr("v") | tonumber) | reverse | .[3:][] | "\(.id) \(.tag_name)"' <<<"$releases")  # stack-reviewer-ignore: the version step fails the job when this versionCode is below the newest release, so the release just made is always the highest and stays in the top three
          [ -z "$stale" ] || while read -r old_id old_tag; do
                echo "pruning $old_tag"
                curl -fsS -X DELETE -H "$auth" "$API/releases/${old_id}"
                curl -fsS -X DELETE -H "$auth" "$API/tags/${old_tag}" || echo "tag $old_tag was already gone"
              done <<<"$stale"
        env:
          RUN_TOKEN: ${{ github.token }}
