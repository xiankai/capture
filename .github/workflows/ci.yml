name: ci
on:
  push:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and lint
        run: ./gradlew --continue testDebugUnitTest lintDebug

      - name: Lint report on failure
        if: failure()
        run: |
          report=app/build/reports/lint-results-debug.txt
          [ -f "$report" ] && tail -100 "$report" || echo "no lint report produced"
