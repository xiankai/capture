name: release
on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.ref_name }}
      APK: app/build/outputs/apk/release/app-release.apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build the signed release APK
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_B64}" || { echo "::error::the SIDELOAD_KEYSTORE_BASE64 secret is not set"; exit 1; }
          test -n "${KEYSTORE_PROPS}" || { echo "::error::the SIDELOAD_KEYSTORE_PROPERTIES secret is not set"; exit 1; }
          property() { awk -F= -v k="$1" '$1 == k { sub(/^[^=]*=/, ""); print; exit }' <<<"$KEYSTORE_PROPS"; }
          export RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/capture-release.jks"
          RELEASE_KEYSTORE_PASSWORD=$(property storePassword)
          RELEASE_KEY_ALIAS=$(property keyAlias)
          RELEASE_KEY_PASSWORD=$(property keyPassword)
          export RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD
          trap 'rm -f "$RELEASE_KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RELEASE_KEYSTORE_PATH"
          ./gradlew assembleRelease
        env:
          KEYSTORE_B64: ${{ secrets.SIDELOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PROPS: ${{ secrets.SIDELOAD_KEYSTORE_PROPERTIES }}

      - name: Verify the signature and match the version to the tag
        run: |
          set -euo pipefail
          [ -f "$APK" ] || { echo "::error::no signed APK; outputs were: $(ls "$(dirname "$APK")")"; exit 1; }
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$tools/apksigner" verify "$APK" || { echo "::error::apksigner did not verify the APK"; exit 1; }
          badging=$("$tools/aapt2" dump badging "$APK")  # stack-reviewer-ignore: aapt2 has had dump badging since build-tools 29; build-tools 36's aapt2 prints the package: versionCode= line parsed below, and $tools is the newest build-tools on the runner
          code=$(awk -F"'" '/^package:/ { for (i = 1; i < NF; i++) if ($i ~ /versionCode=$/) { print $(i + 1); exit } }' <<<"$badging")
          name=$(awk -F"'" '/^package:/ { for (i = 1; i < NF; i++) if ($i ~ /versionName=$/) { print $(i + 1); exit } }' <<<"$badging")
          [ "v${code}" = "$TAG" ] || { echo "::error::the APK's versionCode ${code} does not match tag ${TAG}"; exit 1; }  # stack-reviewer-ignore: both sides are the committer date; the build reads git log %ct (committer, not %at author) and the tag job reads commit.committer.date, checked equal on fdd2975
          echo "VERSION_NAME=${name}" >> "$GITHUB_ENV"

      - name: Publish the GitHub release
        run: |
          set -euo pipefail
          cp "$APK" capture.apk
          newest=$(git ls-remote --tags origin 'refs/tags/v*' | sed -n 's|.*refs/tags/v\([0-9]*\)$|\1|p' | sort -n | tail -1)
          latest=$([ "v${newest}" = "$TAG" ] && echo true || echo false)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" capture.apk --clobber
          else
            gh release create "$TAG" capture.apk --verify-tag --latest="$latest" \
              --title "$VERSION_NAME" --notes "$(git log -1 --pretty='%s%n%n%H')"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
